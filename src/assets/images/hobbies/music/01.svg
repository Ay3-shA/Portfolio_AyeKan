<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1425"/>
      <stop offset="60%" stop-color="#651F3B"/>
      <stop offset="100%" stop-color="#240D18"/>
    </linearGradient>
    <radialGradient id="bloom" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E875A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3A1425" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(242, 169, 194, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#bloom)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Aesthetic Editorial Artwork Lines -->
  <g opacity="0.6" stroke="#E875A0" stroke-width="1" fill="none">
    <circle cx="400" cy="300" r="180" stroke-dasharray="2 6"/>
    <circle cx="400" cy="300" r="140" stroke-opacity="0.4"/>
    <circle cx="400" cy="300" r="220" stroke-opacity="0.2"/>
    <path d="M 220 300 Q 400 180 580 300 T 700 300" stroke-opacity="0.5"/>
    <path d="M 260 240 Q 400 360 540 240" stroke-opacity="0.3"/>
  </g>

  <!-- Editorial typography and framing -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="rgba(242, 169, 194, 0.2)" stroke-width="1"/>
  
  <text x="70" y="85" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" letter-spacing="4" fill="#E875A0" font-weight="600">AYEKAN ARCHIVE // MUSIC</text>
  <text x="730" y="85" font-family="sans-serif" font-size="12" letter-spacing="2" fill="rgba(248, 220, 232, 0.6)" text-anchor="end">PLATE 01</text>

  <g transform="translate(70, 480)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" fill="#FFF8FA" font-style="italic">Analog Valves & Vinyl</text>
    <text x="0" y="24" font-family="sans-serif" font-size="12" letter-spacing="1.5" fill="#E875A0" opacity="0.9">Warm acoustic resonance</text>
  </g>

  <text x="730" y="504" font-family="monospace" font-size="10" letter-spacing="2" fill="rgba(248, 220, 232, 0.5)" text-anchor="end">35MM · F/1.4 · ISO 100</text>
</svg>